overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  # Tiptap 3.31.3 uses the Marked instance API that remains compatible in v18.
  # Keep its types aligned with the app's direct Marked dependency.
  "@tiptap/markdown@3.31.3>marked": 18.0.14
  # Apply patched transitive releases while their parents still request older ranges.
  "@azure/functions@3.5.1>uuid": 11.1.1
  "@chevrotain/cst-dts-gen@11.1.2>lodash-es": 4.18.1
  "@chevrotain/gast@11.1.2>lodash-es": 4.18.1
  "chevrotain@11.1.2>lodash-es": 4.18.1
  "speech-rule-engine@5.0.0-rc.4>@xmldom/xmldom": 0.9.12
  "vite-imagetools@10.0.0>sharp": 0.35.4

# vite-plus-core implements the Vite 8 API but publishes as 1.0.0-rc.0. Resolve all
# Vite peers to that implementation and accept its own package version.
peerDependencyRules:
  allowedVersions:
    vite: 1.0.0-rc.0
    # Upstream peer ranges lag these verified toolchain releases.
    typescript: 7.0.2
    vitest: 5.0.1

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - "@qstyle/compiler@1.0.0-alpha.0"
  - "@qstyle/core@0.1.1"
  - "@qstyle/inspector@0.1.1"
  - "@qstyle/qwik@0.2.0"
  - "@qstyle/vite@0.2.0"
  - "@cloudflare/vite-plugin@1.60.1"
  - miniflare@5.20260923.0-alpha
  - wrangler@4.140.0
patchedDependencies:
  "@qstyle/vite@0.2.0": patches/@qstyle__vite@0.2.0.patch
  "@qwik.dev/core@2.0.0-beta.45": patches/@qwik.dev__core@2.0.0-beta.45.patch
  "@qwik.dev/router@2.0.0-beta.45": patches/@qwik.dev__router-prefetch@2.0.0-beta.45.patch
  "@tiptap/static-renderer@3.31.3": patches/@tiptap__static-renderer@3.31.3.patch
